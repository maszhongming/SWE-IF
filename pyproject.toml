[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-if"
version = "0.1.0"
description = "SWE-IF: augmenting code benchmarks with verifiable software-engineering instructions to align code evaluation with human preference"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ming Zhong and the SWE-IF authors" }]
keywords = ["code-generation", "instruction-following", "llm-evaluation", "benchmark"]

[project.urls]
Paper = "https://arxiv.org/abs/2510.07315"
Code = "https://github.com/maszhongming/SWE-IF"
Dataset = "https://huggingface.co/datasets/MingZhong/SWE-IF"

[tool.setuptools.packages.find]
include = ["swe_if*"]
